[build]
  command = "npm run build"
  publish = ".next"

  [build.environment]
    NODE_VERSION = "20"

[functions]
  # Increase timeout for heavy server actions (bulk registration: up to 26 DB
  # inserts + 26 Sheets calls + 26 emails, run concurrently).
  node_bundler = "nft"

[[plugins]]
  package = "@netlify/plugin-nextjs"
